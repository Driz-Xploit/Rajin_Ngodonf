<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driz Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box-img">
            <div class="menu">
                <a href="#">About</a>
                <a href="#">Privacy</a>
                <a href="#">Term of use</a>
                <a href="#">FAQ</a>
            </div>
        </div>
        <div class="box-form">
            <img src="favicon.ico" alt="" height="80" width="80">
            <form action="result.html">
                <h1>Welcome Back!</h1>
                <p>@Rajin Ngodonf 2025</p>
                <input type="email" name="email" placeholder="Email..." title="Masukkan Akun Email mu..." required autofocus><img style="transform: translate(-150%, 55%);position: absolute;" src="img/mail.png" alt="emailicon" height="25" width="25"><br>
                <input type="password" name="password" placeholder="Password..." id="pwd" title="Masukkan Password mu..." required><img style="transform: translate(-150%, 55%);position: absolute;" src="img/hide.png" alt="hide/show" height="25" width="25" onclick="if (document.getElementById('pwd').type == 'password') {this.src='img/show.jpg' ; document.getElementById('pwd').type = 'text'} else {this.src='img/hide.png' ; document.getElementById('pwd').type = 'password'}"><br>
                <div class="batas"><input type="radio" name="remember" value="True" id="remember" onclick="if (this.type === 'radio') {this.type='checkbox'} else {this.type='radio'} "><label for="remember">Remember me</label><a href="#">Forgot Password?</a></div>
                <input type="submit" value="Login"><br>
                <div class="google"><div class="gcontent"><img src="img/google.png" alt="googleimage" height="25" width="25"><p>Sign In with Google</p></div></div>
                <p>Don't Have An Account?<a href="#">Sign Up!</a></p>
            </form>
        </div>
    </div>
</body>
</html>
