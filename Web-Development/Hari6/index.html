<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YtStream</title>
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
</head>
<body id="body">
    <div class="head">
        <button onclick="document.getElementById('searchs').value = ''" class="cancel"><img src="img/cancel.png" alt="cancel" width="20" height="20"></button>
        <input type="text" class="search-input" id="searchs" placeholder="Cari Video..." aria-label="Kolom pencarian" autofocus>
        <button onclick="getSrc(document.getElementById('searchs').value)" class="search_button"><img src="img/search_image.svg" alt="search_image" width="20" height="20"></button>
    </div>
    <div class="container">
        <div class="content">
            <div class="videos" id="videos">    
            </div>
            <div class="desc">
                <header>
                    <h1>YtStream!</h1>
                </header>
                <main>
                    <div class="foo"><input type="radio" name="jenis" value="iframe" id="yt" checked><br><input type="radio" name="jenis" value="video" id="video"></div>
                    <div class="bar"><label for="yt" onclick="if (! document.getElementById('yt').checked) { document.getElementById('yt').checked = true}">Youtube embed (Id)</label><br><label for="video" onclick="if (! document.getElementById('video').checked) { document.getElementById('video').checked = true}">Local Video (Filename)</label></div>
                </main>
                <footer style="display: flex; justify-content: center;"><a href="help.html" target="_blank">YTStream Guide</a></footer>
                <footer>
                    <em>~ Rajin Ngodonf</em>
                </footer>
                <aside class="bawah">
                    <img src="img/harukachibi.png" alt="harukachibi" class="harukachibi">
                </aside>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
