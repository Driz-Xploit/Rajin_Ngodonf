<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="charset" content="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="img/icon1.ico">
        <title>Projek Hari ke 3 ᓀ‸ᓂ</title>
    </head>
    <body>
        <div class="container">
            <div class="box" id="box">
                <div id="requests">
                    <abbr class="title" title="Menerima input dan merubahnya menjadi tabel data..."><b>Tabel Identitas</b></abbr>
                    <p>Silahkan masukkan datamu</p>
                    <!-- <Learning_Zone> -->
                    <div class="form-group">
                        <form id="data">
                            <input type="text" id="nama" placeholder=" Namamu..." required><br>
                            <input type="number" id="umur" placeholder=" Umurmu..." required><br>
                            <input type="text" placeholder="Tanggal Lahirmu..." id="lahir" onfocus="this.type='date'" onblur="this.type='text';if (this.value !== '') { this.placeholder=this.value } else {this.placeholder='Tanggal Lahirmu...'}" required><br>
                            <input type="radio" name="kelamin" value="Laki-Laki" class="kelamin" id="Laki" checked>
                            <span onclick="document.getElementById('Laki').checked = !(document.getElementById('Laki').checked)">Laki-Laki</span>
                            <input type="radio" name="kelamin" value="Perempuan" class="kelamin" id="Pr">
                            <span onclick="document.getElementById('Pr').checked = !(document.getElementById('Pr').checked)">Perempuan</span>
                         </form>
                    </div>
                    <!-- </Learning_Zone> -->
                    <button onclick="showRespones()" class="req-button">Kirim</button><br>
                    <h3 id="messages" style="display: none;"></h3>
                </div>
                <div id="respones" style="display: none;">
                    <button onclick="showRequests()" class="back-button"><</button>
                    <table>
                        <tr>
                            <td rowspan="5" style='border-radius: 10px 0 0 10px; text-align: center;'>
                                <img src="" alt="Gender Icon" id="gender-icon">
                            </td>
                        </tr>
                        <tr>
                            <th>Nama</th>
                            <td id="text-name" style='border-radius: 0 10px 0 0;'></td>
                        </tr>
                        <tr>
                            <th>Umur</th>
                            <td id="text-age"></td>
                        </tr>
                        <tr>
                            <th>Lahir</th>
                            <td id="text-date"></td>
                        </tr>
                        <tr>
                            <th>Kelamin</th>
                            <td id="text-gender" style='border-radius: 0 0 10px 0;'></td>
                        </tr>       
                    </table>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
